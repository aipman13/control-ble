<script>
// ==========================================================================
// UUID -- HARUS SAMA PERSIS dengan src/ble_sync.cpp di firmware
// ==========================================================================
const SERVICE_UUID      = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0001';
const SYNC_CHAR_UUID    = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0002';
const AUDIO_OUT_UUID    = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0003'; 
const AUDIO_IN_UUID     = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0004'; 
const CONTROL_OUT_UUID  = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0005'; 
const CONTROL_IN_UUID   = '5f1d1000-8b2e-4c1a-9c2e-6f2b6a5d0006'; 

let bleDevice = null;
let syncChar = null, audioOutChar = null, audioInChar = null, controlOutChar = null, controlInChar = null;
let autoSyncTimer = null;

let isRecording = false;
let recordingChunks = [];
let aiModeOn = false;
let volumeFactor = 1.0;

let audioQueue = [];
let isPlayingQueue = false;

const logEl = document.getElementById('log');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const aiDot = document.getElementById('aiDot');
const aiStatusText = document.getElementById('aiStatusText');
const btnConnect = document.getElementById('btnConnect');
const btnSync = document.getElementById('btnSync');
const btnAiToggle = document.getElementById('btnAiToggle');
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const autoSyncToggle = document.getElementById('autoSyncToggle');
const autoSyncInterval = document.getElementById('autoSyncInterval');

function log(msg) {
  const time = new Date().toLocaleTimeString();
  logEl.textContent += `[${time}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setConnectedUI(connected) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = connected ? `Terhubung ke ${bleDevice?.name || 'Desk Buddy'}` : 'Belum terhubung';
  btnConnect.textContent = connected ? 'Putuskan Koneksi' : 'Sambungkan ke Desk Buddy';
  btnSync.disabled = !connected;
  btnAiToggle.disabled = !connected;
  if (!connected) {
    autoSyncToggle.checked = false;
    stopAutoSync();
    aiModeOn = false;
    btnAiToggle.textContent = 'Aktifkan Mode AI';
    setAiUI('idle');
  }
}

function setAiUI(state) {
  aiDot.classList.remove('active', 'connected');
  if (state === 'listening') {
    aiDot.classList.add('active');
    aiStatusText.textContent = 'Mode AI: mendengarkan...';
  } else if (state === 'thinking') {
    aiDot.classList.add('active');
    aiStatusText.textContent = 'Mode AI: memproses...';
  } else if (state === 'speaking') {
    aiDot.classList.add('connected');
    aiStatusText.textContent = 'Mode AI: menjawab...';
  } else {
    aiStatusText.textContent = 'Mode AI: nonaktif';
  }
}

// ==========================================================================
// Koneksi BLE
// ==========================================================================
async function connectBLE() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
    return;
  }
  if (!navigator.bluetooth) {
    alert("❌ Browser tidak mendukung Web Bluetooth / Wajib HTTPS.");
    log('❌ Browser ini tidak mendukung Web Bluetooth.');
    return;
  }
  try {
    log('Mencari perangkat Bluetooth...');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    bleDevice.addEventListener('gattserverdisconnected', () => {
      log('🔌 Bluetooth terputus.');
      syncChar = audioOutChar = audioInChar = controlOutChar = controlInChar = null;
      setConnectedUI(false);
    });

    log(`Menyambungkan ke ${bleDevice.name}...`);
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    syncChar       = await service.getCharacteristic(SYNC_CHAR_UUID);
    audioOutChar   = await service.getCharacteristic(AUDIO_OUT_UUID);
    audioInChar    = await service.getCharacteristic(AUDIO_IN_UUID);
    controlOutChar = await service.getCharacteristic(CONTROL_OUT_UUID);
    controlInChar  = await service.getCharacteristic(CONTROL_IN_UUID);

    await audioOutChar.startNotifications();
    audioOutChar.addEventListener('characteristicvaluechanged', onAudioChunkFromDevice);

    await controlOutChar.startNotifications();
    controlOutChar.addEventListener('characteristicvaluechanged', onControlFromDevice);

    log('✅ Terhubung! Siap sinkronisasi & Mode AI.');
    setConnectedUI(true);
  } catch (e) {
    log('❌ Gagal konek: ' + e.message);
  }
}

// ==========================================================================
// Sinkronisasi Waktu & Cuaca
// ==========================================================================
function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation tidak didukung browser ini'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(new Error('Gagal ambil lokasi: ' + err.message)),
      { enableHighAccuracy: false, timeout: 10000 }
    );
  });
}

async function reverseGeocode(lat, lon) {
  const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Reverse geocode gagal: HTTP ' + res.status);
  const data = await res.json();
  return data.city || data.locality || data.principalSubdivision || 'Unknown';
}

const WMO_DESC = {
  0: 'Clear', 1: 'Mostly Clear', 2: 'P.Cloudy', 3: 'Overcast',
  45: 'Fog', 48: 'Fog',
  51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle',
  61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain',
  80: 'Rain Showers', 81: 'Rain Showers', 82: 'Rain Showers',
  95: 'Thunderstorm'
};

async function fetchWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Open-Meteo error: HTTP ' + res.status);
  const data = await res.json();
  const c = data.current || {};
  return {
    desc: WMO_DESC[c.weather_code] || '--',
    temp: c.temperature_2m ?? 0,
    feels_like: c.apparent_temperature ?? 0,
    humidity: c.relative_humidity_2m ?? 0
  };
}

async function syncNow() {
  if (!syncChar) { log('❌ Belum terhubung ke Desk Buddy.'); return; }
  btnSync.disabled = true;
  try {
    log('📍 Mengambil lokasi...');
    const loc = await getLocation();
    log('🏙️ Mencari nama kota...');
    const city = await reverseGeocode(loc.lat, loc.lon);
    log('☁️ Mengambil data cuaca...');
    const weather = await fetchWeather(loc.lat, loc.lon);

    const payload = {
      epoch: Math.floor(Date.now() / 1000),
      utc_offset: -(new Date().getTimezoneOffset() * 60),
      city: city,
      weather: weather
    };
    const json = JSON.stringify(payload);
    log('📤 Mengirim: ' + json);
    await syncChar.writeValue(new TextEncoder().encode(json));
    log(`✅ Sinkron berhasil! ${city}, ${weather.desc} ${weather.temp}°C`);
  } catch (e) {
    log('❌ Error: ' + e.message);
  } finally {
    btnSync.disabled = false;
  }
}

function stopAutoSync() {
  if (autoSyncTimer) { clearInterval(autoSyncTimer); autoSyncTimer = null; }
}

autoSyncToggle.addEventListener('change', () => {
  stopAutoSync();
  if (autoSyncToggle.checked) {
    const minutes = parseInt(autoSyncInterval.value, 10);
    log(`⏱️ Auto-sync diaktifkan, tiap ${minutes} menit.`);
    syncNow();
    autoSyncTimer = setInterval(syncNow, minutes * 60 * 1000);
  } else {
    log('⏱️ Auto-sync dimatikan.');
  }
});

// ==========================================================================
// Mode AI - Pemrosesan Audio & Kontrol
// ==========================================================================
function onControlFromDevice(event) {
  const msg = new TextDecoder().decode(event.target.value);
  log('📥 Device: ' + msg);

  if (msg === 'GREETING_REQUEST') {
    handleGreeting();
  } else if (msg === 'REC_START') {
    isRecording = true;
    recordingChunks = [];
    setAiUI('listening');
  } else if (msg === 'REC_END') {
    isRecording = false;
    setAiUI('thinking');
    handleRecording();
  } else if (msg === 'REC_CANCEL') {
    isRecording = false;
    recordingChunks = [];
    setAiUI('listening');
    log('🤫 Hening terdeteksi (ESP32 kembali mendengarkan).');
  }
}

function onAudioChunkFromDevice(event) {
  if (!isRecording) return;
  const value = event.target.value;
  const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
  recordingChunks.push(bytes.slice());
}

async function handleGreeting() {
  try {
    const hour = new Date().getHours();
    let salam = (hour >= 4 && hour < 11) ? 'pagi' : (hour >= 11 && hour < 15) ? 'siang' : (hour >= 15 && hour < 18) ? 'sore' : 'malam';
    const template = document.getElementById('greetingTemplate').value || 'Selamat {salam}!';
    const text = template.replace('{salam}', salam);

    log('👋 Sapaan: ' + text);
    await speakAndSend(text, 'happy');
  } catch (e) {
    log('❌ Error sapaan: ' + e.message);
  }
}

async function processAudioQueue() {
  if (isPlayingQueue || audioQueue.length === 0) return;
  isPlayingQueue = true;
  while (audioQueue.length > 0) {
    const task = audioQueue.shift();
    try { await task(); } catch (e) { log('❌ Error queue: ' + e.message); }
  }
  isPlayingQueue = false;
}

// ---- Rekaman Selesai -> STT -> Groq LLM -> ElevenLabs TTS ----
async function handleRecording() {
  const resetEspToListening = async () => {
    if (controlInChar) {
      await controlInChar.writeValue(new TextEncoder().encode('PLAY_START:default'));
      await controlInChar.writeValue(new TextEncoder().encode('PLAY_END'));
    }
    setAiUI('listening');
  };

  try {
    const groqKey = document.getElementById('groqKey').value.trim();
    const elevenKey = document.getElementById('elevenKey').value.trim();

    if (!groqKey || !elevenKey) {
      log('⚠️ API Key Groq atau ElevenLabs belum diisi!');
      alert('Isi Groq API Key dan ElevenLabs API Key terlebih dahulu!');
      await resetEspToListening();
      return;
    }

    if (recordingChunks.length === 0) {
      log('⚠️ Rekaman kosong.');
      await resetEspToListening();
      return;
    }

    let totalLen = 0;
    for (const c of recordingChunks) totalLen += c.length;
    const merged = new Uint8Array(totalLen);
    let offset = 0;
    for (const c of recordingChunks) { merged.set(c, offset); offset += c.length; }
    recordingChunks = [];

    const sampleRate = parseInt(document.getElementById('voiceSampleRate').value, 10) || 16000;
    const wavBlob = pcmBytesToWavBlob(merged, sampleRate);

    log('🗣️ Transkrip via Groq Whisper...');
    const transcript = await groqTranscribe(wavBlob);

    const rawTranscript = (transcript || '').trim();
    const cleanedText = rawTranscript.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();

    const hallucinationKeywords = ["terima kasih", "terimakasih", "thanks", "thank you", "subtitles", "amara", "watching", "menonton"];
    const isTooShort = cleanedText.length < 2;
    const isHallucination = hallucinationKeywords.some(k => cleanedText.includes(k));

    if (!cleanedText || isTooShort || isHallucination) {
      log('🤫 Hening / Halusinasi terdeteksi. Kembali mendengarkan...');
      await resetEspToListening();
      return;
    }

    log('📝 User: "' + rawTranscript + '"');
    log('🧠 Memproses jawaban AI...');
    setAiUI('thinking');

    let currentMood = 'default';
    let isFirstChunk = true;

    await groqChatStream(
      rawTranscript,
      (extractedMood) => { currentMood = extractedMood; },
      (clauseText) => {
        audioQueue.push(async () => {
          if (isFirstChunk) {
            setAiUI('speaking');
            await controlInChar.writeValue(new TextEncoder().encode('PLAY_START:' + currentMood));
            isFirstChunk = false;
          }

          const mp3Buf = await elevenLabsTts(clauseText);
          const pcm = await decodeAndResample(mp3Buf, sampleRate);
          applyVolume(pcm, volumeFactor);

          const bytes = new Uint8Array(pcm.buffer);
          const chunkSize = parseInt(document.getElementById('bleChunkSize').value, 10) || 100;
          for (let o = 0; o < bytes.length; o += chunkSize) {
            const chunk = bytes.slice(o, o + chunkSize);
            await audioInChar.writeValueWithoutResponse(chunk);
            await new Promise(r => setTimeout(r, 15));
          }
        });
        processAudioQueue();
      }
    );

    audioQueue.push(async () => {
      const paddingBytes = new Uint8Array(Math.floor(sampleRate * 0.2) * 2);
      const chunkSize = parseInt(document.getElementById('bleChunkSize').value, 10) || 100;
      for (let o = 0; o < paddingBytes.length; o += chunkSize) {
        const chunk = paddingBytes.slice(o, o + chunkSize);
        await audioInChar.writeValueWithoutResponse(chunk);
        await new Promise(r => setTimeout(r, 15));
      }
      await new Promise(r => setTimeout(r, 50));
      await controlInChar.writeValue(new TextEncoder().encode('PLAY_END'));
      log('✅ Jawaban selesai diputar.');
      setAiUI('listening');
    });

    processAudioQueue();

  } catch (e) {
    log('❌ Error: ' + e.message);
    await resetEspToListening();
  }
}

// ---- WAV Encoder ----
function pcmBytesToWavBlob(pcmBytes, sampleRate) {
  const numChannels = 1, bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = pcmBytes.length;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);
  new Uint8Array(buffer, 44).set(pcmBytes);
  return new Blob([buffer], { type: 'audio/wav' });
}

// ---- Groq STT (Whisper) ----
async function groqTranscribe(wavBlob) {
  const apiKey = document.getElementById('groqKey').value.trim();
  const form = new FormData();
  form.append('file', wavBlob, 'audio.wav');
  form.append('model', 'whisper-large-v3');
  form.append('language', 'id');
  form.append('response_format', 'json');

  const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}` },
    body: form
  });
  if (!res.ok) throw new Error(`Groq STT error: HTTP ${res.status}`);
  const data = await res.json();
  return data.text || '';
}

// ---- Groq LLM Stream ----
async function groqChatStream(userText, onFirstMood, onSentenceChunk) {
  const apiKey = document.getElementById('groqKey').value.trim();
  const model = document.getElementById('groqModel').value.trim() || 'llama-3.3-70b-versatile';
  const systemPrompt = document.getElementById('systemPrompt').value;

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: model,
      messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userText }],
      stream: true,
      temperature: 0.7
    })
  });

  if (!res.ok) throw new Error(`Groq LLM error: HTTP ${res.status}`);

  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '', fullResponse = '', moodExtracted = false, sentenceBuffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || trimmed === 'data: [DONE]') continue;
      if (trimmed.startsWith('data: ')) {
        try {
          const parsed = JSON.parse(trimmed.slice(6));
          const token = parsed.choices?.[0]?.delta?.content || '';
          if (!token) continue;

          fullResponse += token;
          sentenceBuffer += token;

          if (!moodExtracted && fullResponse.includes(']')) {
            const match = fullResponse.match(/^\[(.*?)\]/);
            onFirstMood(match ? match[1].toLowerCase() : 'default');
            sentenceBuffer = sentenceBuffer.replace(/^\[.*?\]/, '').trimStart();
            moodExtracted = true;
          }

          if (moodExtracted) {
            const matchIndex = sentenceBuffer.search(/[\.\,\?\!\n]/);
            if (matchIndex !== -1 && matchIndex >= 8) {
              const clause = sentenceBuffer.slice(0, matchIndex + 1).trim();
              sentenceBuffer = sentenceBuffer.slice(matchIndex + 1);
              if (clause) onSentenceChunk(clause);
            }
          }
        } catch (_) {}
      }
    }
  }

  if (sentenceBuffer.trim().length > 0) onSentenceChunk(sentenceBuffer.trim());
}

// ---- ElevenLabs TTS ----
async function elevenLabsTts(text) {
  const apiKey = document.getElementById('elevenKey').value.trim();
  const voiceId = document.getElementById('elevenVoiceId').value.trim() || '21m00Tcm4TlvDq8ikWAM';
  const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}/stream?optimize_streaming_latency=4`;

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'xi-api-key': apiKey, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
    body: JSON.stringify({
      text: text,
      model_id: "eleven_flash_v2_5",
      voice_settings: { stability: 0.5, similarity_boost: 0.5 }
    })
  });
  if (!res.ok) throw new Error(`ElevenLabs error: HTTP ${res.status}`);
  return await res.arrayBuffer();
}

// ---- Resampling PCM ----
async function decodeAndResample(mp3ArrayBuffer, targetSampleRate) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const tempCtx = new AudioCtx();
  const decoded = await tempCtx.decodeAudioData(mp3ArrayBuffer.slice(0));
  tempCtx.close();

  const srcRate = decoded.sampleRate;
  const srcData = decoded.getChannelData(0);
  const ratio = srcRate / targetSampleRate;
  const newLength = Math.floor(srcData.length / ratio);
  const int16 = new Int16Array(newLength);

  for (let i = 0; i < newLength; i++) {
    const srcIndex = i * ratio;
    const indexFloor = Math.floor(srcIndex);
    const indexNext = Math.min(indexFloor + 1, srcData.length - 1);
    const fraction = srcIndex - indexFloor;
    const sample = srcData[indexFloor] + fraction * (srcData[indexNext] - srcData[indexFloor]);
    const s = Math.max(-1, Math.min(1, sample));
    int16[i] = s < 0 ? s * 32768 : s * 32767;
  }
  return int16;
}

function applyVolume(int16Array, factor) {
  if (factor === 1.0) return;
  for (let i = 0; i < int16Array.length; i++) {
    let v = int16Array[i] * factor;
    if (v > 32000) v = 32000;
    if (v < -32000) v = -32000;
    int16Array[i] = Math.round(v);
  }
}

async function speakAndSend(text, mood) {
  setAiUI('speaking');
  const mp3Buf = await elevenLabsTts(text);
  const targetRate = parseInt(document.getElementById('voiceSampleRate').value, 10) || 16000;
  const pcm = await decodeAndResample(mp3Buf, targetRate);
  applyVolume(pcm, volumeFactor);

  await controlInChar.writeValue(new TextEncoder().encode('PLAY_START:' + mood));
  const bytes = new Uint8Array(pcm.buffer);
  const chunkSize = parseInt(document.getElementById('bleChunkSize').value, 10) || 100;
  for (let offset = 0; offset < bytes.length; offset += chunkSize) {
    const chunk = bytes.slice(offset, offset + chunkSize);
    await audioInChar.writeValueWithoutResponse(chunk);
    await new Promise(r => setTimeout(r, 15));
  }
  await controlInChar.writeValue(new TextEncoder().encode('PLAY_END'));
  setAiUI('listening');
}

btnAiToggle.addEventListener('click', async () => {
  if (!controlInChar) { log('❌ Belum terhubung BLE.'); return; }
  try {
    if (!aiModeOn) {
      await controlInChar.writeValue(new TextEncoder().encode('AI_ON'));
      aiModeOn = true;
      btnAiToggle.textContent = 'Matikan Mode AI';
      log('🟢 Mode AI diaktifkan.');
    } else {
      await controlInChar.writeValue(new TextEncoder().encode('AI_OFF'));
      aiModeOn = false;
      btnAiToggle.textContent = 'Aktifkan Mode AI';
      isRecording = false;
      recordingChunks = [];
      setAiUI('idle');
      log('🔴 Mode AI dimatikan.');
    }
  } catch (e) {
    log('❌ Gagal kirim perintah Mode AI: ' + e.message);
  }
});

volumeSlider.addEventListener('input', () => {
  volumeFactor = parseInt(volumeSlider.value, 10) / 100;
  volumeValue.textContent = volumeSlider.value + '%';
});

btnConnect.addEventListener('click', connectBLE);
btnSync.addEventListener('click', syncNow);

log('Halaman siap. Isikan API Key lalu klik "Sambungkan ke Desk Buddy".');
</script>
